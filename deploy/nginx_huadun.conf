# 华小盾迎宾 HTTPS 反向代理 —— 解锁浏览器麦克风（getUserMedia 需安全上下文）
#
# 安装：
#   1) 先跑 deploy/make_selfsigned_cert.sh 生成 /etc/nginx/ssl/huadun.{crt,key}
#   2) sudo cp deploy/nginx_huadun.conf /etc/nginx/conf.d/huadun.conf
#   3) 确认下面 listen 的证书路径、proxy_pass 端口(8011)与实际一致
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) 腾讯云安全组放行 TCP 443
#   浏览器访问： https://62.234.29.115/huadun_chat.html
#
# 说明：只有信令/字幕/ASR(HTTP+WebSocket)走这里；WebRTC 的音视频是浏览器与服务器
#       之间的 UDP 直连（aiortc），不经过 nginx，故无需在此转发媒体端口。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/huadun.crt;
    ssl_certificate_key /etc/nginx/ssl/huadun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # SSE 字幕流：关闭缓冲，实时推送
    location = /sse {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # 本地 ASR WebSocket
    location = /api/asr {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
    }

    # 其余（/offer /human /set_audiotype /api/kb 及静态页面）
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
    }
}

# 可选：把 http 80 自动跳到 https
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
